name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 发布 Release 需要写仓库内容的权限
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 用官方 Gradle 发行版而不是 gradlew：
      # wrapper 的 distributionUrl 指向腾讯云镜像（为国内网络优化），海外 runner 上反而慢
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 \
            || sdkmanager --install "platforms;android-36" > /dev/null

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Resolve version from build.gradle.kts
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "无法从 app/build.gradle.kts 读取 versionName"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK="zhku-schedule-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "构建产物：$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhku-schedule-${{ steps.ver.outputs.version }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      # 打 v* 标签才发 Release，普通分支 push 只产出 artifact
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.apk }}
          name: 仲恺课表 ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > 本构建由 GitHub Actions 自动生成（`${{ github.sha }}`）。
            > APK 为 debug 证书自签名，仅供个人侧载安装。

            下载 `${{ steps.ver.outputs.apk }}`，传到手机安装即可。
            详细说明见 [README](../blob/main/README.md)。
