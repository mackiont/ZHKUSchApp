name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 发布 Release 需要写仓库内容的权限
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 用官方 Gradle 发行版而不是 gradlew：
      # wrapper 的 distributionUrl 指向腾讯云镜像（为国内网络优化），海外 runner 上反而慢
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ubuntu-latest 自带 platform 36 / build-tools 36.0.0，无需安装；
      # 这里只兜底接受 license，让 AGP 在镜像变化时还能自己补包
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager 不在预期路径，跳过 license 接受"
          fi

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Resolve version from build.gradle.kts
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then echo "无法从 app/build.gradle.kts 读取 versionName"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK="zhku-schedule-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "构建产物：$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhku-schedule-${{ steps.ver.outputs.version }}
          path: ${{ steps.ver.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      # 打 v* 标签才发 Release，普通分支 push 只产出 artifact
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.apk }}
          name: 仲恺课表 ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            > 本构建由 GitHub Actions 自动生成（`${{ github.sha }}`）。
            > APK 为 debug 证书自签名，仅供个人侧载安装。

            下载 `${{ steps.ver.outputs.apk }}`，传到手机安装即可。
            详细说明见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)。

            ### 本次更新：修复 Bug

            - **修复部分手机无法添加桌面小组件的问题**：MIUI / HyperOS 等桌面不一定会把
              第三方应用列进小组件列表。现在新增两个入口，直接调起系统的一键添加，不再依赖列表：
              「长按应用图标 → 添加小组件」与「设置 → 桌面 → 添加桌面小组件」
            - 补充小组件预览图，避免部分桌面在列表里显示空白预览
            - 小组件名称加上应用名，在列表里按「仲恺」即可搜到

            添加方式：长按应用图标选「添加小组件」，或进入 设置 → 桌面 → 添加桌面小组件，
            系统会弹出确认框，确认后小组件直接落到桌面。

            ![小组件](https://raw.githubusercontent.com/${{ github.repository }}/main/screenshots/widget.png)
