name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.13"

jobs:
  test:
    name: testDebugUnitTest
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ubuntu-latest 自带 platform 36 / build-tools 36.0.0，无需安装；
      # 这里只兜底接受 license，让 AGP 在镜像变化时还能自己补包
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          else
            echo "sdkmanager 不在预期路径，跳过 license 接受"
          fi

      # 解析 / 导入 / 周次 / 登录协议测试，以及 Robolectric 界面截图（不需要账号和真机）
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      # 失败的用例直接打成 annotation，不用翻日志就能看到是哪条断言挂了
      - name: Summarize failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      msg = (bad.get('message') or bad.get('type') or 'unknown').strip()
                      msg = msg.replace('\n', ' ')[:500]
                      print(f"::error title={name}::{msg}")
          PY

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            app/build/screenshots/
            build/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 30
